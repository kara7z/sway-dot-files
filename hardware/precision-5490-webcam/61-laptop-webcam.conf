# PipeWire apps use the processed libcamera source directly. The compatibility
# device is for apps opening a V4L2 device themselves.
monitor.v4l2.rules = [
  {
    matches = [
      { device.bus-path = "pci-0000:00:05.0" device.product.name = "ipu6" }
      { api.v4l2.cap.driver = "v4l2 loopback" device.product.name = "Laptop Webcam" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
