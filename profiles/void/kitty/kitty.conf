# Returned to kitty factory default — custom theme disabled
# include ./dark-theme.auto.conf


# Fonts
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Optional
font_size 12.0
disable_ligatures never
map f11 toggle_fullscreen
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+t launch --cwd current --type tab
map ctrl+q close_window
map ctrl+w close_tab

# Window settings
remember_window_size no
# window_padding_width 8

# Scroll wheel
scrollbar_handle_opacity 0.5
scrollbar_track_opacity 0.5
scrollbar_track_hover_opacity 0.5
confirm_os_window_close 0
sync_to_monitor no

cursor_shape block
# cursor_trail 10 caused perceived typing lag everywhere, compounded inside
# nvim :terminal (nvim buffers cursor moves + kitty animates 10 extra frames).
# 1 = effectively off. Re-enable to 3 max if you want subtle trail.
cursor_trail 1
cursor_trail_start_threshold 0
cursor_trail_decay 0.03 0.06

cursor_blink_interval 0
cursor_stop_blinking_after 0

# kitty's shell integration forces a blinking BAR cursor (\e[5 q) at shell
# prompts, which overrides cursor_shape above -> prompt showed "|" instead of
# a block. "no-cursor" keeps every other shell-integration feature but lets
# cursor_shape win.
# See: kitty docs, cursor_shape -> "...shell integration sets the cursor shape
# to beam at shell prompts. You can avoid this by setting shell_integration to

# this add cursor block into zsh
shell_integration no-cursor

# Use Kitty's default colors; no external theme file is required.
