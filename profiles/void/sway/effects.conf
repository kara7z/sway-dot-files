# SwayFX effects matching kara7z/sway-dot-files.
animation_duration_ms 250
corner_radius 0
default_dim_inactive 0.0
for_window [class="^steam_app_"]    blur disable
for_window [app_id="^steam_app_"]   blur disable
for_window [class="^steam$"]        blur disable
for_window [class="[.]exe$"]        blur disable
for_window [class="^gamescope"]     blur disable
for_window [app_id="^gamescope"]    blur disable
for_window [class="^[Mm]inecraft"]  blur disable
for_window [app_id="^[Mm]inecraft"] blur disable
for_window [class="^[Ll]utris"]     blur disable
for_window [class="^[Hh]eroic"]     blur disable
blur enable
# Kitty alone hits a rendering fault with background blur.
for_window [app_id="^kitty$"] blur disable
for_window [class="^kitty$"] blur disable
blur_xray disable
blur_passes 5
blur_radius 5
corner_radius 0
smart_corner_radius enable
shadows disable
shadows_on_csd disable

# Transparent panels and menus need explicit layer-shell blur rules.
layer_effects "waybar" "blur enable"
layer_effects "wofi" "blur enable"
layer_effects "swaync-control-center" "blur enable"
layer_effects "swaync-notification-window" "blur enable"
